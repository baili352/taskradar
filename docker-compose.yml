services:
  taskradar:
    build: .
    image: taskradar:0.1.0
    container_name: taskradar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: production
      APP_TIMEZONE: Asia/Shanghai
      MAX_UPLOAD_MB: "10"
      # 大模型配置从宿主机 .env 注入，绝不写进镜像
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
    volumes:
      - taskradar-data:/data

volumes:
  taskradar-data:
