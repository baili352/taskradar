# TaskRadar 生产环境 Nginx 配置
# 放置位置：/etc/nginx/sites-available/taskradar.conf
# 启用：ln -s /etc/nginx/sites-available/taskradar.conf /etc/nginx/sites-enabled/
# 域名准备好后，把 server_name 改成你的域名，再执行 certbot --nginx -d 你的域名

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 前端构建产物（在本地 npm run build 后上传到该目录）
    root /opt/taskradar/frontend/dist;
    index index.html;

    # 后端上传上限 10MB，这里留出 multipart 开销
    client_max_body_size 12m;

    # 接口反向代理：只监听本机 8000，不直接暴露
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR 处理扫描件可能较慢，放宽读写超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
